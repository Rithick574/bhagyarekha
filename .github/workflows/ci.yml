name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bhagyarekha
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: bhagyarekha_demo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bhagyarekha"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      APP_ENV: ci
      DATA_MODE: demo
      API_PORT: 3001
      DATABASE_URL: postgres://bhagyarekha:ci_only_not_a_secret@localhost:5432/bhagyarekha_demo
      TEST_DATABASE_URL: postgres://bhagyarekha:ci_only_not_a_secret@localhost:5432/bhagyarekha_test
      ALLOWED_ORIGIN: http://localhost:3000
      PUBLIC_BASE_URL: http://localhost:3000
      INTERNAL_API_BASE_URL: http://localhost:3001
      WEB_PORT: 3000
      LOG_LEVEL: warn
      TRUST_PROXY_HOPS: 0
      RATE_LIMIT_PER_MINUTE: 100000
      RATE_LIMIT_CHECK_PER_MINUTE: 100000
      RATE_LIMIT_STATS_PER_MINUTE: 100000
      ALLOW_SELF_REVIEW: 'true'
      INSECURE_DEV_COOKIES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: PGPASSWORD=ci_only_not_a_secret psql -h localhost -U bhagyarekha -d postgres -c 'CREATE DATABASE bhagyarekha_test'
      - run: pnpm -r --filter './packages/**' run build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm contracts:check
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm env:init -- --mode demo
      - run: pnpm seed:demo
      - name: Create e2e admin users (non-secret CI credentials)
        run: |
          echo 'correct-horse-battery-staple' | pnpm admin:create -- --email publisher@example.test --role PUBLISHER
          echo 'correct-horse-battery-staple' | pnpm admin:create -- --email editor@example.test --role EDITOR
      - name: Install Playwright browser
        run: pnpm --filter @bhagyarekha/e2e exec playwright install --with-deps chromium
      - name: End-to-end and accessibility checks
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-and-screenshots
          path: |
            tests/e2e/playwright-report
            tests/e2e/screenshots
          if-no-files-found: ignore
